name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Frozen: a lockfile that does not match package.json should fail the
      # build rather than be silently resolved away.
      - run: pnpm install --frozen-lockfile

      # The optional wallet kit currently has one unpatched low advisory.
      # Fail on every advisory at moderate severity or higher.
      - run: pnpm audit --audit-level=moderate

      # Build BEFORE test: the tests import the generated bindings package by
      # name, which only resolves once its dist/ exists.
      - run: pnpm run build

      - run: pnpm test --run

      - run: pnpm exec tsc -p relayer-proxy/tsconfig.json --noEmit

      - run: pnpm --filter indexer-demo test

      # The demo consumes the SDK's public API, so this catches breaking
      # changes that the unit tests do not.
      - run: pnpm run build:demo

      - run: pnpm --filter indexer-demo build

      - uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0
        with:
          version: 28.0.0

      - run: pnpm verify:bindings

      - run: pnpm pack --dry-run

      - run: git diff --check

      # `prebuild` regenerates src/version.ts; if that leaves the tree dirty,
      # the committed version constant is stale.
      - name: Check for uncommitted changes
        run: git diff --exit-code
