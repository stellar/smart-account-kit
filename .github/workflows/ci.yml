name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Frozen: a lockfile that does not match package.json should fail the
      # build rather than be silently resolved away.
      - run: pnpm install --frozen-lockfile

      # The optional wallet kit currently has one unpatched low advisory.
      # Fail on every advisory at moderate severity or higher.
      - run: pnpm audit --audit-level=moderate

      # Build BEFORE test: the tests import the generated bindings package by
      # name, which only resolves once its dist/ exists.
      - run: pnpm run build

      - run: pnpm test --run

      - run: pnpm --filter indexer-demo test

      # The demo consumes the SDK's public API, so this catches breaking
      # changes that the unit tests do not.
      - run: pnpm run build:demo

      - run: pnpm --filter indexer-demo build

      - run: pnpm verify:bindings

      - run: pnpm pack --dry-run

      - run: git diff --check

      # `prebuild` regenerates src/version.ts; if that leaves the tree dirty,
      # the committed version constant is stale.
      - name: Check for uncommitted changes
        run: git diff --exit-code
