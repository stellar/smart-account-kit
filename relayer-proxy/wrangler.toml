name = "smart-account-relayer-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespace for storing API keys per IP
# Create KV namespace:
# wrangler kv namespace create API_KEYS
[[kv_namespaces]]
binding = "API_KEYS"
id = "6d548e99f4e14aeb93c25c7d2c0928b5"
# For preview/dev:
# preview_id = "<your-preview-kv-namespace-id>"

[[durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RequestRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RequestRateLimiter"]

# Increase CPU limit for long-running retries on testnet.
# On testnet, if Relayer channel accounts are missing (after testnet reset),
# we fund them via friendbot and retry for up to 5 minutes.
# Network wait time (fetch calls) doesn't count toward CPU time.
# Mainnet uses default limit since no retries occur there.
[limits]
cpu_ms = 300_000

[vars]
# Network this instance serves
NETWORK = "testnet"
RELAYER_BASE_URL = "https://channels.openzeppelin.com/testnet"
STELLAR_RPC_URL = "https://soroban-testnet.stellar.org"
ALLOWED_ORIGINS = "https://smart-account-kit-demo.pages.dev"
ALLOWED_DEPLOYER_ADDRESSES = "GAAH4OT36RRCCAGKARGPN2HLHT2NOBVFHO4GUHA6CF7UKQ4MMV24WQ4N"
ALLOWED_ACCOUNT_WASM_HASHES = "1b5f4534a76322da2ad7c745f6900857a6802b0ca79850c35a03561df997785a"
ALLOWED_WALLET_CONTRACT_IDS = ""
ALLOWED_WALLET_FUNCTIONS = "execute,upgrade,add_policy,remove_policy,add_signer,remove_signer,add_context_rule,remove_context_rule,batch_add_signer,update_context_rule_name,update_context_rule_valid_until"
MAX_RESOURCE_FEE_STROOPS = "1000000"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_PER_IP = "10"
RATE_LIMIT_GLOBAL = "100"

# Testnet-only by policy: no mainnet relayer proxy. (A previous `[env.production]`
# / mainnet worker was intentionally removed — smart-account-kit fee-sponsorship
# runs on testnet only, through OpenZeppelin Channels.)
